# CodeQL is the static analysis GitHub itself runs; golangci-lint checks style
# and correctness, this looks for exploitable patterns. Findings land in the
# Security tab. Actions are pinned by SHA for the reason given in ci.yml.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Rules are updated between releases, so re-run against unchanged code.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.mod

      - name: Initialize
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          build-mode: autobuild

      - name: Analyze
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:go
