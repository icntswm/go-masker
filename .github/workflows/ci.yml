name: CI

# Actions are pinned by commit SHA, not by tag: a tag can be moved to different
# code, a SHA cannot. Dependabot updates the pin and the version comment
# together.
#
# A pull request from a branch in this repository fires both events, so an
# unfiltered push would run every job twice for the same commit. Pushes are
# limited to what nothing else covers: the default branch and release tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Superseded runs on the same ref are cancelled so they do not compete for
# runners with the run that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & checks (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    # Every job carries a timeout: the default is six hours, which is a long
    # time to pay for a hung test. The slowest run of this job is under three
    # minutes.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every minor release in the supported window declared by go.mod,
        # plus stable so a new Go release is caught before it is listed here.
        go-version: ['1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          # The module has no dependencies and therefore no go.sum;
          # without this the cache is disabled and every job recompiles.
          cache-dependency-path: go.mod
      - name: Vet
        run: make vet
      - name: Check formatting
        run: make fmt-check
      - name: Unit tests
        run: make test
      - name: Unit tests with race detector
        run: make race

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Single pinned version on purpose: golangci-lint embeds go/types from
          # the Go release it was built with and panics on a newer toolchain.
          # Keep this at or below the Go version used to build the linter.
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # govulncheck itself needs a recent toolchain; it reports on the
          # standard library this module is built against.
          go-version: stable
          cache: true
          cache-dependency-path: go.mod
      - name: govulncheck
        run: make vulncheck

  masking-matrix:
    name: Masking matrix (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod
      - name: 260 masking scenarios with result checks
        run: make bench-matrix

  fuzz:
    name: Fuzz smoke (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod
      - name: Five fuzz targets, 30s each
        run: make fuzz
