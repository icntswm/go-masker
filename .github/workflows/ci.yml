name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Superseded runs on the same ref are cancelled so they do not compete for
# runners with the run that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & checks (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every minor release in the supported window declared by go.mod,
        # plus stable so a new Go release is caught before it is listed here.
        go-version: ['1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          # The module has no dependencies and therefore no go.sum;
          # without this the cache is disabled and every job recompiles.
          cache-dependency-path: go.mod
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test ./...
      - name: Unit tests with race detector
        run: go test -race ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Single pinned version on purpose: golangci-lint embeds go/types from
          # the Go release it was built with and panics on a newer toolchain.
          # Keep this at or below the Go version used to build the linter.
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # govulncheck itself needs a recent toolchain; it reports on the
          # standard library this module is built against.
          go-version: stable
          cache: true
          cache-dependency-path: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  masking-matrix:
    name: Masking matrix (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod
      - name: 260 masking scenarios with result checks
        run: make bench-matrix

  fuzz:
    name: Fuzz smoke (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x', '1.25.x', '1.26.x', '1.27.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.mod
      - name: Five fuzz targets, 30s each
        run: make fuzz
