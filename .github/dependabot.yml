version: 2

updates:
  # The module has no third-party dependencies, so the workflow actions are
  # all that need watching.
  # Pinned action majors go stale quietly: a runner deprecation is announced
  # as a warning long before it becomes an error.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
    # init and analyze must run the same release, and a separate pull
    # request for each fails CI until both land.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
